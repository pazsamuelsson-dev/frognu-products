title: ZO Skin Health Complexion Clearing Masque 85g
body: >
  Djuprengörande lermask mot akne och orenheter. Absorberar överskottsfett och
  renar porerna på djupet.
  Indikering: Oljig och aknebenägen hud.
  Användning: Appliceras på ren hud 1–2 ggr/vecka. Låt verka i 10 minuter och
  skölj av.
  Ingredienser: Kaolin, bentonite och salicylsyra som absorberar talg och
  rengör på djupet.
