title: ZO Skin Health Balancing Cleansing Emulsion 200ml
body: >
  En kliniskt beprövad rengöring som stöttar den skyddande hudbarriären och gör
  huden lugn, smidig och stark. Parfym-, färg- och sulfatfri. Utvecklad speciellt
  för känslig hud och för användning efter behandling.
  Appliceras på torr hud morgon och kväll. Massera runt ansikte och ögon i ca
  en minut. Skölj noggrant.
  Ingredienser: Sockerhärledda emulgerande ämnen – sackaros laurate, sackaros
  stearat, sackaros palmetat (mild rengöring utan att skada hudbarriären),
  Bisabolol och havrekärnextrakt (lugnande), Caprylic/capric triglycerid och
  ethylhexyl palmetat (mjukgörande, stöttar barriärfunktionen).
