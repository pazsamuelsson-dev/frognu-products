title: ZO Skin Health Exfoliating Cleanser Normal to Oily Skin 200ml
body: >
  En exfolierande rengöring som målinrikat avlägsnar överflödigt talg och
  orenheter som kan täppa till porerna.
  Indikering: Normal till fet hud.
