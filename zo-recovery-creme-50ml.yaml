title: ZO Skin Health Recovery Crème 50ml
body: >
  Lugnande, rik kräm för torr och känslig hud. Ceramider återfuktar och
  förebygger fuktförlust medan retinol bidrar till att reducera fina linjer
  och rynkor. Stärker hudbarriären för en friskare hud.
  Indikering: Torr och känslig hud.
  Användning: Appliceras på ren, torr hud varje kväll eller efter behov.
  Ingredienser: Ceramide NG, squalane och sheasmör (barriärskydd mot fuktförlust),
  Lactococcus ferment lysate (stärker hudbarriären), Polyglutaminsyra (återfuktar),
  Acetyl hexapeptid-8 (mjukar upp uttryckslinjer), ZCORE™/caprooyl tetrapeptide-3
  (fastare hudstruktur), Retinol (cellförnyelse, kollagenproduktion).
