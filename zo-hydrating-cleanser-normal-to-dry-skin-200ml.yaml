title: ZO Skin Health Hydrating Cleanser Normal to Dry Skin 200ml
body: >
  En skonsam rengöring som effektivt avlägsnar orenheter och make up.
  Innehåller pantenol och allantoin som tillför fukt, lugnar ner och reducerar
  irritation hos en känslig och torr hud.
  Indikering: Normal till torr hud.
  Användning: Skumma upp produkten med lite vatten och massera ansikte och hals
  i en minut. Skölj noga med vatten.
  Ingredienser: Natriumhyaluronat, pantenol, glycerin, natrium-PCA och urea
  (återfuktande ämnen), Allantoin (antiirritant).
