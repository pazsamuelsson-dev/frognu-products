title: ZO Skin Health Renewal Crème 50ml
body: >
  En lätt kräm anpassad för alla hudtyper, även fet hud. Inkapslat retinol
  bidrar till att reducera fina linjer, medan antioxidanter och antiirritanter
  skyddar och lugnar ned huden.
  Indikering: Lätt återfuktning för mild torrhet och fuktförlust. Lindrar och
  minimerar rodnad.
  Användning: Appliceras på ren, torr hud varje morgon eller efter behov.
  Ingredienser: Ektoin, glycerin, natriumhyaluronat och jojobaester
  (återupprättar fuktnivån), Avena sativa, epilobium angustifolium och
  planktonextrakt (lindrar irritation), Lactococcus ferment lysate (stärker
  hudbarriären), Polyglutaminsyra (återfuktar), Acetyl hexapeptid-8 (mjukar
  upp uttryckslinjer), Retinol (cellförnyelse, kollagenproduktion).
