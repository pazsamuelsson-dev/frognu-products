title: ZO Skin Health Calming Toner pH Balancer 180ml
body: >
  Lugnande, pH-balanserande toner som reducerar orenheter och stärker en svag
  och känslig hud.
  Indikering: Torr till känslig hud.
  Användning: Används morgon och kväll efter rengöring. Applicera på ansikte
  och hals med en bomullspad. Undvik ögonområdet.
  Ingredienser: Bladextrakt av amerikansk trollhassel/hamamelis virginiana
  (astringerande, porminimering), Glykolsyra (kemisk exfoliering),
  Pantenol, natriumhyaluronat och natrium-PCA (återfuktande),
  Allantoin (antiirritant).
