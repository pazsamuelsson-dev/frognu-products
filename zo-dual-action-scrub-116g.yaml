title: ZO Skin Health Dual-Action Scrub 116g
body: >
  Allsidig och effektiv ansiktspeeling som tar bort bakterier och bidrar till
  en ren hud. Kemiska och fysiska exfolianter tar bort döda hudceller medan
  Tea Tree-olja löser upp och tar bort överflödig talg.
  Indikering: Fet till oren hud.
  Användning: Appliceras på rengjord hud. Masseras lätt i cirkelrörelser i ca
  1 minut. Används 2–7 ggr/vecka.
  Ingredienser: Mjölksyra och salicylsyra (kemisk exfoliering), Syntetiskt
  vax och kandelillavax (mekanisk exfoliering), Melaleuca alternifolia-bladolja/
  teoljebuske (antibakteriell), Glycerol och natrium-PCA (återfuktande),
  ZO-RRS2™ och ZOX12™ (antioxidanter, antiinflammatoriska).
