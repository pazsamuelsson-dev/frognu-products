title: ZO Skin Health Daily Power Defense 50ml
body: >
  Daily Power Defense är din must-have-produkt som skyddar mot miljömässiga
  skador och mot för tidiga ålderstecken genom att återfukta huden och bygga
  upp hudens barriärfunktion.
  Indikering: Alla hudtyper.
  Användning: 1–2 pump masseras in på ansikte och hals. Applicera UV-skydd.
  Ingredienser: Vitamin A och E (antioxidanter), ZO-RRS2®, ZPOLY™,
  Micrococcus lysate och arabidopsis thaliana extracts (stöttar naturlig
  cellulär reparation), Omega-6 Ceramider/safflower oil–palm oil aminopropanediol
  esters (återuppbygger hudbarriären).
